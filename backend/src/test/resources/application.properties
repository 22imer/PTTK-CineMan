spring.application.name=cineman

# Test: H2 chế độ MySQL, nạp lại schema.sql + data.sql mỗi lần khởi động context
spring.datasource.url=jdbc:h2:mem:cineman;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

points.per-amount=20000

# Test-only: JWT_SECRET cố định đủ 32 byte (không dùng cho môi trường thật).
auth.jwt-secret=test-only-jwt-secret-32-bytes-minimum-0001
auth.cookie-secure=false
auth.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
