spring.application.name=cineman

# MySQL — schema.sql + data.sql nạp ngoài ứng dụng (docker-entrypoint-initdb.d hoặc mysql CLI, ARCHITECTURE §11)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cineman?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=SERVER}
spring.datasource.username=${DB_USER:cineman}
spring.datasource.password=${DB_PASSWORD:cineman}
spring.sql.init.mode=never

# R1: 1 điểm / 20.000đ tiền vé trước voucher
points.per-amount=20000

# Phiên JWT (ARCHITECTURE §7.3). JWT_SECRET bắt buộc, >= 32 byte UTF-8, không có khóa mặc định:
# thiếu/sai độ dài → ứng dụng fail startup thay vì chạy với khóa yếu.
auth.jwt-secret=${JWT_SECRET}
auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
